# negentropy 团队清单（机器可读）
# 修改本文件属于结构性变更，必须同步 evolution/CHANGELOG.md。

schema_version: 1

team:
  name: negentropy
  version: 0.3.0
  description: 以文档和可验证证据为协作介质、以每类事实的权威来源为准的软件开发团队
  protocol: v1.1-docs
  language: zh-CN

governance:
  philosophy: team/philosophy.md
  file: team/governance.md
  concurrency: team/concurrency.md
  workflow_profiles: team/workflow-profiles.md
  validation_command: python scripts/validate_team.py

# 下列枚举和策略的机器权威来源是本文件；Markdown 只解释语义，不重复拥有定义权。

statuses:
  document: [DRAFT, IN_REVIEW, APPROVED, BLOCKED, SUPERSEDED, ARCHIVED]
  project: [ACTIVE, PAUSED, BLOCKED, COMPLETED, ARCHIVED]
  stage: [NOT_STARTED, READY, IN_PROGRESS, IN_REVIEW, DONE, BLOCKED, SKIPPED]
  work_item: [READY, CLAIMED, IN_PROGRESS, IN_REVIEW, BLOCKED, DONE, CANCELLED]
  question: [OPEN, RESOLVED, DEFERRED]
  change: [PENDING, APPROVED, REJECTED, IMPLEMENTED, SUPERSEDED]

action_modes:
  inspect: {writes: false, commit: false, publish: false}
  draft: {writes: docs_only, commit: false, publish: false}
  implement: {writes: scoped, commit: false, publish: false}
  integrate: {writes: scoped, commit: explicit_or_project_policy, publish: false}
  publish: {writes: scoped, commit: explicit_or_project_policy, publish: explicit_authorization}

external_principals: [team-owner, project-owner, business-owner, product-owner]

# 只机器化高风险/门禁型交付物；普通 notes 不强制正式审批。
approval_policies:
  team-definition: {approvers: [team-owner], handoff_required: false}
  project-brief: {approvers: [project-owner], handoff_required: true}
  business-rules: {approvers: [business-owner], handoff_required: true}
  requirements: {approvers: [product-owner], handoff_required: true}
  architecture: {approvers: [architect], handoff_required: true}
  api-contract: {approvers: [architect], handoff_required: true}
  data-contract: {approvers: [architect], handoff_required: true}
  test-report: {approvers: [test-engineer], handoff_required: true}
  deployment-plan: {approvers: [devops-engineer], handoff_required: true}
  production-release: {approvers: [project-owner], handoff_required: true}

roles:
  - id: orchestrator
    name: 编排者
    control_plane: true
    entropy: 协作熵
    stages: [0, 7]
    dir: team/roles/orchestrator
    charter: team/roles/orchestrator/AGENT.md
    skills: team/roles/orchestrator/skills.md
    mission: 路由工作、维护状态、执行流程门禁并保护用户授权边界
    outputs: [STATE.md, WORKBOARD.md, 00-intake/project-brief.md, 07-retro/retrospective.md]

  - id: business-liaison
    name: 业务对接员
    entropy: 业务熵
    stages: [1]
    dir: team/roles/business-liaison
    charter: team/roles/business-liaison/AGENT.md
    skills: team/roles/business-liaison/skills.md
    mission: 澄清业务背景、术语、流程及外部依赖
    outputs: [01-business/business-brief.md, 01-business/glossary.md]

  - id: product-manager
    name: 产品经理
    entropy: 需求熵
    stages: [2]
    dir: team/roles/product-manager
    charter: team/roles/product-manager/AGENT.md
    skills: team/roles/product-manager/skills.md
    mission: 整理需求、用户故事、验收标准和迭代计划
    outputs: [02-requirements/requirements.md, 02-requirements/user-stories/, 02-requirements/iteration-plan.md]

  - id: architect
    name: 架构工程师
    entropy: 设计熵
    stages: [3]
    dir: team/roles/architect
    charter: team/roles/architect/AGENT.md
    skills: team/roles/architect/skills.md
    mission: 技术选型、系统设计、接口和数据模型
    outputs: [03-architecture/architecture.md, 03-architecture/api-spec.md, 03-architecture/data-model.md]

  - id: frontend-engineer
    name: 前端工程师
    entropy: 实现熵(界面)
    stages: [4]
    parallel_group: implementation
    dir: team/roles/frontend-engineer
    charter: team/roles/frontend-engineer/AGENT.md
    skills: team/roles/frontend-engineer/skills.md
    mission: 界面、交互与前端测试
    outputs: [04-implementation/frontend-notes.md]

  - id: backend-engineer
    name: 后端工程师
    entropy: 实现熵(服务)
    stages: [4]
    parallel_group: implementation
    dir: team/roles/backend-engineer
    charter: team/roles/backend-engineer/AGENT.md
    skills: team/roles/backend-engineer/skills.md
    mission: 服务、数据库、权限和接口
    outputs: [04-implementation/backend-notes.md]

  - id: test-engineer
    name: 测试工程师
    entropy: 质量熵
    stages: [5]
    dir: team/roles/test-engineer
    charter: team/roles/test-engineer/AGENT.md
    skills: team/roles/test-engineer/skills.md
    mission: 测试方案、自动化测试、缺陷与回归
    outputs: [05-testing/test-plan.md, 05-testing/defect-log.md, 05-testing/test-report.md]

  - id: devops-engineer
    name: 运维工程师
    entropy: 运维熵
    stages: [6]
    dir: team/roles/devops-engineer
    charter: team/roles/devops-engineer/AGENT.md
    skills: team/roles/devops-engineer/skills.md
    mission: 环境、部署、监控、备份和发布
    outputs: [06-ops/deployment.md, 06-ops/release-notes.md]

workflow:
  file: team/workflow.md
  default_profile: full
  profiles: [full, existing-spec, feature, bugfix, spike, ops-only]
  profile_maturity:
    full: beta
    existing-spec: stable
    feature: experimental
    bugfix: experimental
    spike: experimental
    ops-only: experimental
  stages:
    - {id: intake, stage: 0, owner: orchestrator}
    - {id: business, stage: 1, owner: business-liaison}
    - {id: requirements, stage: 2, owner: product-manager}
    - {id: architecture, stage: 3, owner: architect}
    - {id: implementation, stage: 4, owner: [frontend-engineer, backend-engineer], parallel: conditional}
    - {id: testing, stage: 5, owner: test-engineer}
    - {id: release, stage: 6, owner: devops-engineer}
    - {id: retrospective, stage: 7, owner: orchestrator}
  feedback_loops:
    - {from: architect, to: product-manager, trigger: 需求不可实现或歧义}
    - {from: test-engineer, to: backend-engineer, trigger: 后端缺陷}
    - {from: test-engineer, to: frontend-engineer, trigger: 前端缺陷}
    - {from: devops-engineer, to: backend-engineer, trigger: 部署阻塞}
    - {from: product-manager, to: business-liaison, trigger: 业务背景不足}

handoff:
  file: team/handoff.md
  state_file: projects/<project>/STATE.md
  workboard_file: projects/<project>/WORKBOARD.md

project_template: projects/_template
evolution:
  changelog: evolution/CHANGELOG.md
  roadmap: evolution/roadmap.md
